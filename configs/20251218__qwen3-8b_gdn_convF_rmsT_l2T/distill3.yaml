model:
  ctx_len: 1024

train:
  wandb: qwen2rwkv
  
  proj_suffix: 4-1k
  train_stage: 3
  load_partial: 0

  data_type: "binidx" 
  data_file: "/mnt/nfs/hei/data/dclm-10B" #"data/minipile_qwen2" 
  my_exit_tokens: 500000000 #1491785955
  magic_prime: 1464917

  optimizer: dsfusedadamw
  lr_wait: 0.8
  lr_decay_type: linear
  lr_init: 6.25e-5
  lr_final: 6.25e-5
  warmup_steps: 50 
  beta1: 0.9 
  beta2: 0.95 
  adam_eps: 1e-8 
  weight_decay: 0

  devices: 6
  num_nodes: 1
  micro_bsz: 4
  accumulate_grad_batches: 3 # 96 total bsz
  strategy: fsdp 
  grad_cp: 1
  ds_bucket_mb: 200 # set to 2 for consumer GPUs, set to 200 for A100 / H100 (affects speed & vram usage)

  epoch_save: 1
  
